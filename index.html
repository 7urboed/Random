<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>for you</title>
<meta name="theme-color" content="#020604">
<style>
@property --art  { syntax:'<color>'; inherits:true; initial-value:#9dffc4; }
@property --art2 { syntax:'<color>'; inherits:true; initial-value:#19c9b5; }
@property --leaf { syntax:'<color>'; inherits:true; initial-value:#2fd37a; }
@property --txt  { syntax:'<color>'; inherits:true; initial-value:#39ff88; }
@property --glow { syntax:'<color>'; inherits:true; initial-value:#00ff66; }
@property --bg   { syntax:'<color>'; inherits:true; initial-value:#020604; }
@property --scan { syntax:'<color>'; inherits:true; initial-value:#00ff66; }
:root{
  --art:#9dffc4; --art2:#19c9b5; --leaf:#2fd37a; --txt:#39ff88; --glow:#00ff66; --bg:#020604; --scan:#00ff66;
  --mono:"JetBrains Mono","IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace;
  transition:--art .9s ease,--art2 .9s ease,--leaf .9s ease,--txt .9s ease,--glow .9s ease,--bg .9s ease,--scan .9s ease;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--mono);font-weight:300;overflow-x:hidden;
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}

.hero{position:relative;z-index:1;height:100svh;min-height:420px;overflow:hidden;
  display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.field{position:absolute;inset:0;overflow:hidden;will-change:opacity,transform;
  -webkit-mask-image:linear-gradient(to bottom,#000 0,#000 42%,rgba(0,0,0,.55) 68%,transparent 94%);
  mask-image:linear-gradient(to bottom,#000 0,#000 42%,rgba(0,0,0,.55) 68%,transparent 94%);
  background:radial-gradient(ellipse 80% 60% at 50% 40%,color-mix(in srgb,var(--glow) 14%,transparent),transparent 72%)}
.grid{position:absolute;left:0;top:0;margin:0;font-family:var(--mono);font-weight:400;font-size:var(--fs,8px);
  line-height:var(--lh,13px);white-space:pre;letter-spacing:0;user-select:none;-webkit-user-select:none;pointer-events:none}
#art{z-index:1;filter:drop-shadow(0 0 7px color-mix(in srgb,var(--glow) 50%,transparent))}
#art span.r{display:block;height:var(--lh);visibility:hidden}
#art span.r.on{visibility:visible}
#art span.r.boot{animation:boot .32s steps(2,end)}
@keyframes boot{0%{filter:brightness(2.4)}35%{opacity:.25}60%{opacity:1;filter:brightness(1.6)}100%{opacity:1;filter:none}}
#art i{font-style:normal}
#art i.f{color:color-mix(in srgb,var(--art) calc((1 - var(--t,0))*100%),var(--art2));text-shadow:0 0 5px var(--glow)}
#art i.g{color:color-mix(in srgb,var(--leaf) calc((1 - var(--t,0))*100%),var(--art2))}
#art i.s{color:color-mix(in srgb,var(--leaf) calc((1 - var(--t,0))*100%),var(--art2));opacity:.4}

#masks{position:absolute;inset:0;z-index:2;pointer-events:none}
#masks div{position:absolute;display:none;background:var(--bg);box-shadow:0 0 5px 1px var(--bg)}
#bfly{z-index:3;color:color-mix(in srgb,var(--art) 55%,#fff);
  text-shadow:0 0 3px var(--art),0 0 10px var(--glow),0 0 24px var(--glow)}

.prompt{position:relative;z-index:5;height:2.4rem;display:flex;align-items:center;font-size:.8rem;letter-spacing:.12em;color:var(--txt);
  opacity:0;transition:opacity 1.6s ease,color .9s ease;text-shadow:0 0 6px var(--glow),0 0 2px #000}
.prompt.show{opacity:.7}
.prompt.gone{opacity:0!important;transition-duration:.9s}
.cursor{display:inline-block;width:.6em;height:1em;margin-left:.35em;background:var(--txt);box-shadow:0 0 8px var(--glow);
  animation:blink 1.1s steps(1) infinite;transition:background .9s ease}
@keyframes blink{50%{opacity:0}}

.swatches{position:relative;z-index:5;display:flex;gap:6px;justify-content:center;padding:.1rem 0 max(.9rem,env(safe-area-inset-bottom))}
.sw{width:48px;height:48px;border:0;background:none;display:grid;place-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.sw span{width:22px;height:22px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);
  outline:2px solid transparent;outline-offset:5px;transition:outline-color .3s,transform .3s,box-shadow .3s}
.sw:hover span{transform:scale(1.12)}
.sw[aria-checked="true"] span{outline-color:var(--c);box-shadow:0 0 14px var(--c),0 0 28px var(--c)}
.sw:focus-visible span{outline-color:#fff}

.letter{position:relative;z-index:1;pointer-events:none;margin-top:-20svh;min-height:100svh;display:grid;place-items:center;padding:12vh 6vw 18vh;text-align:center}
.letter h2{font-weight:200;font-size:clamp(2.4rem,11vw,6.5rem);letter-spacing:.04em;line-height:1.15;color:var(--txt);
  text-shadow:0 0 3px var(--txt),0 0 14px var(--glow),0 0 42px color-mix(in srgb,var(--glow) 55%,transparent);min-height:1.2em}
.letter h2 .ch{opacity:0;display:inline-block;transform:translateY(.25em);transition:opacity .5s ease,transform .7s ease}
.letter h2.in .ch{opacity:1;transform:none}
.letter .sub{margin-top:2.2rem;font-size:.8rem;letter-spacing:.3em;opacity:0;transition:opacity 2s ease 2.4s;color:var(--txt);text-shadow:0 0 6px var(--glow)}
.letter .sub.in{opacity:.5}

/* CRT overlay stack: above content, never blocks taps */
.crt{position:fixed;inset:0;pointer-events:none;z-index:50}
.scan{background:repeating-linear-gradient(to bottom,color-mix(in srgb,var(--scan) 7%,transparent) 0,color-mix(in srgb,var(--scan) 7%,transparent) 1px,transparent 1px,transparent 3px);mix-blend-mode:screen}
.sweep{background:linear-gradient(to bottom,transparent,color-mix(in srgb,var(--scan) 10%,transparent) 50%,transparent);
  height:18vh;inset:auto 0 auto 0;top:-20vh;animation:sweep 8s linear infinite;animation-delay:2s}
@keyframes sweep{0%{transform:translateY(0)}100%{transform:translateY(140vh)}}
.vig{background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
.flick{background:#fff;opacity:0;mix-blend-mode:overlay;animation:flick 5s steps(1) infinite}
@keyframes flick{0%,100%{opacity:0}46%{opacity:.012}47%{opacity:0}48%{opacity:.02}49%{opacity:0}}

@media (prefers-reduced-motion:reduce){
  .sweep,.flick{display:none}.cursor{animation:none}
  #art span.r.boot{animation:none}
  .letter h2 .ch,.letter .sub,.prompt{transition:none}
}
</style>
</head>
<body>
<section class="hero" id="hero">
  <div class="field" id="field">
    <pre class="grid" id="art" role="img" aria-label="Ascii art of a field of tulips"></pre>
    <div id="masks"></div>
    <pre class="grid" id="bfly" aria-hidden="true"></pre>
  </div>
  <div class="prompt" id="prompt">&gt; scroll<span class="cursor"></span></div>
  <div class="swatches" id="swatches" role="radiogroup" aria-label="Screen colour"></div>
</section>

<section class="letter">
  <div>
    <h2 id="iloveyou" aria-label="I love you"></h2>
    <p class="sub" id="sub">// end of transmission</p>
  </div>
</section>

<div class="crt scan"></div><div class="crt sweep"></div><div class="crt flick"></div><div class="crt vig"></div>

const hero=$('hero'), field=$('field'), pre=$('art'), bflyEl=$('bfly'), masksEl=$('masks'), prompt=$('prompt');

function measureAR(){
  const m=document.createElement('span');
  m.style.cssText='position:absolute;visibility:hidden;white-space:pre;font:400 100px '+getComputedStyle(document.body).fontFamily;
  m.textContent='0'.repeat(40); document.body.appendChild(m);
  const w=m.getBoundingClientRect().width/40/100; m.remove(); return w>0.3&&w<0.9?w:0.6;
}
function buildGrid(){
  const vw=hero.clientWidth, vh=hero.clientHeight;
  const cols=Math.max(52,Math.min(180,Math.round(vw/7)));
  const cw=vw/cols, fs=cw/AR, lh=fs, rows=Math.ceil(vh/lh)+1;
  field.style.setProperty('--fs',fs+'px'); field.style.setProperty('--lh',lh+'px');
  const gw=vw, gh=rows*lh, iw=img.naturalWidth, ih=img.naturalHeight, s=Math.max(gw/iw,gh/ih);
  const sw=gw/s, sh=gh/s, sx=(iw-sw)/2, sy=(ih-sh)*0.22;
  const cv=document.createElement('canvas'); cv.width=cols*4; cv.height=rows*4;
  const ctx=cv.getContext('2d',{willReadFrequently:true});
  ctx.drawImage(img,sx,sy,sw,sh,0,0,cv.width,cv.height);
  const px=ctx.getImageData(0,0,cv.width,cv.height).data, W=cv.width, n=rows*cols;
  const L=new Float32Array(n),S=new Float32Array(n),F=new Float32Array(n),G=new Float32Array(n);
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    let l=0,s_=0,f=0,g=0;
    for(let j=0;j<4;j++)for(let i=0;i<4;i++){
      const k=((y*4+j)*W+x*4+i)*4, r=px[k]/255, gg=px[k+1]/255, b=px[k+2]/255;
      l+=.299*r+.587*gg+.114*b;
      const sky=(b>r+.02&&b>=gg-.02), fl=(r>gg+.08&&!sky);
      if(sky)s_++; else if(fl)f++; else g++;
    }
    const o=y*cols+x; L[o]=l/16;S[o]=s_/16;F[o]=f/16;G[o]=g/16;
  }
  let mn=1,mx=0; for(const v of L){if(v<mn)mn=v;if(v>mx)mx=v;}
  const chars=[],kinds=[],flowers=[];

    const cr=[],kr=[];
    for(let x=0;x<cols;x++){
      const o=y*cols+x; let ln=(L[o]-mn)/((mx-mn)||1); ln=Math.pow(Math.max(0,Math.min(1,(ln-.25)/.75)),.9);

        const h=(((x*73856093)^(y*19349663))>>>0)%1000/1000;

      let v=ln; if(S[o]>.25) v*=.5;
      v+=(BAYER[y%4][x%4]-.5)*.22;
      const ch=RAMP[Math.floor(Math.max(0,Math.min(.999,v))*RAMP.length)];
      const k=F[o]>=G[o]?'f':'g'; cr.push(ch); kr.push(ch===' '?'s':k);
      if(k==='f'&&ln>.55&&x>6&&x<cols-6&&y>3&&y<rows-8) flowers.push({x,y});
    }
    chars.push(cr);kinds.push(kr);
  }
  return {cols,rows,cw,lh,chars,kinds,flowers};
}
const esc=c=>c==='<'?'&lt;':c==='>'?'&gt;':c==='&'?'&amp;':c;
function renderArt(){
  pre.textContent=''; rowEls=[];
  for(let y=0;y<grid.rows;y++){
    let html='',run='',k='';
    for(let x=0;x<grid.cols;x++){
      const kk=grid.kinds[y][x];
      if(kk!==k){ if(run) html+=`<i class="${k}">${run}</i>`; run=''; k=kk; }
      run+=esc(grid.chars[y][x]);
    }
    if(run) html+=`<i class="${k}">${run}</i>`;
    const s=document.createElement('span'); s.className='r'; s.style.setProperty('--t',(y/Math.max(1,grid.rows-1)).toFixed(3)); s.innerHTML=html; pre.appendChild(s); rowEls.push(s);
  }
  for(let i=0;i<shown;i++) rowEls[grid.rows-1-i]?.classList.add('on');
}

/* ---------- butterflies: ascii sprites stepping at 10fps ---------- */
let bflies=[], maskDivs=[], started=false, heroVisible=true;
const rnd=(a,b)=>a+Math.random()*(b-a);
function pickTarget(b){
  const f=grid.flowers; if(!f.length) return;
  let t; for(let i=0;i<8;i++){ t=f[(Math.random()*f.length)|0]; if(!b.tx||Math.hypot(t.x-b.tx,(t.y-b.ty)*1.6)>grid.cols*.12) break; }
  b.tx=t.x; b.ty=t.y-1;
}
function initButterflies(){
  const n=hero.clientWidth<600?3:5;
  bflies=[]; masksEl.textContent=''; maskDivs=[];
  for(let i=0;i<n;i++){
    const b={i,vis:false,state:'wait',wait:.5+i*.9+Math.random()*.6,t:Math.random()*10,x:0,y:0,tx:0,ty:0,rest:0,dx:0,dy:0,frame:CLOSED};
    bflies.push(b);
    const ds=[]; for(let r=0;r<4;r++){ const d=document.createElement('div'); masksEl.appendChild(d); ds.push(d);} maskDivs.push(ds);
  }
}
function spawn(b){
  const side=Math.random()<.5?-1:1;
  b.x=side<0?-12:grid.cols+12; b.y=rnd(grid.rows*.08,grid.rows*.6); pickTarget(b); b.state='fly'; b.vis=true;
}
function placeResting(){ // reduced motion / after resize
  bflies.forEach(b=>{ pickTarget(b); b.x=b.tx; b.y=b.ty; b.dx=b.x; b.dy=b.y; b.state='rest'; b.rest=1e9; b.vis=true; b.frame=MID; });
  drawButterflies();
}
function tick(){
  if(!heroVisible||!grid) return;
  const sp=grid.cols*.011;
  for(const b of bflies){
    b.t+=.1;
    if(b.state==='wait'){ b.wait-=.1; if(b.wait<=0) spawn(b); else continue; }
    if(b.state==='fly'){
      const dx=b.tx-b.x, dy=b.ty-b.y, d=Math.hypot(dx,dy*1.6);
      if(d<2.2){ b.x=b.tx; b.y=b.ty; b.state='rest'; b.rest=25+Math.random()*35; }
      else { const s=sp*(.75+.25*Math.sin(b.t*2+b.i)); b.x+=dx/d*s; b.y+=dy/d*s/1.6; }
      b.dx=b.x+Math.cos(b.t*3+b.i)*(b.state==='fly'?1:0); b.dy=b.y+Math.sin(b.t*5+b.i)*(b.state==='fly'?1.1:0);
      b.frame=FLAP[(Math.floor(b.t*10)+b.i)%4];
    } else if(b.state==='rest'){
      b.dx=b.x; b.dy=b.y; b.frame=RESTF[Math.floor(b.t*5+b.i)%6];
      if(--b.rest<=0){ pickTarget(b); b.state='fly'; }
    }
  }
  drawButterflies();
}
function drawButterflies(){
  const {cols,rows,cw,lh}=grid;
  const g=Array.from({length:rows},()=>new Array(cols).fill(' '));
  bflies.forEach((b,bi)=>{
    const ds=maskDivs[bi];
    if(!b.vis){ ds.forEach(d=>d.style.display='none'); return; }
    const ox=Math.round(b.dx)-6, oy=Math.round(b.dy)-1;
    b.frame.forEach((row,r)=>{
      const d=ds[r], yy=oy+r; let first=-1,last=-1;
      for(let c=0;c<13;c++) if(row[c]!==' '){ if(first<0)first=c; last=c; }
      if(first<0||yy<0||yy>=rows){ d.style.display='none'; return; }
      d.style.display='block'; d.style.left=(ox+first)*cw+'px'; d.style.top=yy*lh+'px';
      d.style.width=(last-first+1)*cw+'px'; d.style.height=lh+'px';
      for(let c=first;c<=last;c++){ const xx=ox+c; if(xx>=0&&xx<cols&&row[c]!==' ') g[yy][xx]=row[c]; }
    });
  });
  bflyEl.textContent=g.map(r=>r.join('')).join('\n');
}

/* ---------- boot: empty beat, then grow bottom -> top over ~5s ---------- */
const BEAT=900, DUR=5000;
function finishGrowth(){
  growthDone=true; shown=grid.rows; rowEls.forEach(r=>r.classList.add('on')); prompt.classList.add('show');
  if(!started){ started=true; initButterflies(); if(reduce) placeResting(); else setInterval(tick,100); }
}
function start(){
  AR=measureAR(); grid=buildGrid(); renderArt();
  if(reduce){ finishGrowth(); return; }
  let t0=null; const ease=p=>1-Math.pow(1-p,2.2);
  function frame(ts){
    if(t0===null) t0=ts;
    const t=ts-t0-BEAT;
    if(t>0){
      const p=Math.min(1,t/DUR), want=Math.ceil(ease(p)*grid.rows);
      while(shown<want){ const el=rowEls[grid.rows-1-shown]; if(el) el.classList.add('on','boot'); shown++; }
      if(p>=1){ finishGrowth(); return; }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
img.onload=()=>start(); img.src=IMG_SRC;

let rz; addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>{
  if(!grid) return; grid=buildGrid(); renderArt();
  if(started){ if(reduce) placeResting(); else bflies.forEach(b=>{ if(b.state!=='wait') pickTarget(b); }); }
},150); });
new IntersectionObserver(es=>{heroVisible=es[0].isIntersecting},{threshold:0}).observe(hero);

/* flowers dissolve (and drift slowly) as you scroll toward the letter */
let fadeRaf=0;
function fieldFade(){
  fadeRaf=0;
  const y=scrollY, h=hero.clientHeight, p=Math.min(1,Math.max(0,y/(h*.8)));
  field.style.opacity=(1-p*.96).toFixed(3);
  field.style.transform=reduce?'':`translateY(${(y*.22).toFixed(1)}px)`;
}
addEventListener('scroll',()=>{ if(!fadeRaf) fadeRaf=requestAnimationFrame(fieldFade); },{passive:true});
fieldFade();

/* ---------- scroll -> "I love you" ---------- */
const h2=$('iloveyou'), sub=$('sub');
[...'I love you'].forEach((c,i)=>{
  const s=document.createElement('span'); s.className='ch'; s.setAttribute('aria-hidden','true');
  s.textContent=c===' '?'\u00a0':c; s.style.transitionDelay=reduce?'0s':(i*.14)+'s'; h2.appendChild(s);
});
let revealed=false;
new IntersectionObserver(es=>{
  if(revealed||!es.some(e=>e.isIntersecting)) return; revealed=true;
  h2.classList.add('in'); sub.classList.add('in'); prompt.classList.add('gone'); prompt.classList.remove('show');
},{threshold:.55}).observe(h2);
</script>
