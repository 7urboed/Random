<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#020604" />
  <title>for you, in phosphor</title>
  <style>
    :root { --ink:#b9ffd0; --art:#e5ffed; --core:#6dff9a; --halo:rgba(75,255,143,.45); --bg:#020604; --scan:rgba(112,255,158,.13); }
    * { box-sizing:border-box; }
    html { background:var(--bg); scroll-behavior:smooth; }
    body { margin:0; min-width:320px; overflow-x:hidden; background:var(--bg); color:var(--ink); font-family:"Cascadia Mono","SFMono-Regular",Consolas,"Liberation Mono",monospace; transition:background 700ms ease,color 700ms ease; }
    .crt, .vignette { position:fixed; inset:0; z-index:5; pointer-events:none; }
    .crt { opacity:.36; background:repeating-linear-gradient(to bottom, transparent 0 2px, var(--scan) 2px 3px); mix-blend-mode:screen; }
    .sweep { position:fixed; left:0; right:0; height:18vh; z-index:6; pointer-events:none; opacity:.16; background:linear-gradient(transparent, var(--scan), transparent); animation:sweep 10s linear infinite; }
    .vignette { z-index:7; background:radial-gradient(ellipse at center, transparent 36%, rgba(0,0,0,.25) 75%, rgba(0,0,0,.72) 100%); }
    main { position:relative; z-index:1; }
    .hero { min-height:100svh; padding:clamp(24px,6vh,68px) 20px 86px; display:flex; flex-direction:column; align-items:center; justify-content:center; }
    .terminal-label { width:min(760px,100%); margin:0 0 clamp(18px,4vh,42px); opacity:0; font-size:clamp(10px,1.5vw,13px); letter-spacing:.12em; text-align:left; animation:labelIn .8s 1.1s forwards; }
    .flowers { width:100%; max-width:850px; min-height:clamp(350px,61vh,560px); display:flex; justify-content:center; align-items:center; overflow:visible; }
    pre { margin:0; width:max-content; max-width:100%; color:var(--art); font-size:clamp(8px,1.67vw,18px); line-height:1.04; letter-spacing:0; white-space:pre; text-shadow:0 0 2px var(--art), 0 0 8px var(--core), 0 0 24px var(--halo); transition:color 700ms ease,text-shadow 700ms ease; }
    .line { display:block; opacity:0; transform:translateY(8px); filter:brightness(2); }
    .line.on { animation:grow .42s cubic-bezier(.16,.8,.28,1) forwards, flash .28s ease-out; }
    .prompt { margin:clamp(15px,3vh,28px) 0 0; min-height:26px; opacity:0; font-size:clamp(11px,2vw,14px); letter-spacing:.06em; text-shadow:0 0 7px var(--halo); animation:hintIn 1s 4.9s forwards; transition:opacity .6s ease; }
    .cursor { display:inline-block; width:.62em; height:1.05em; vertical-align:-.2em; background:var(--ink); box-shadow:0 0 8px var(--core); animation:blink 1.1s steps(2,end) infinite; }
    .swatches { position:absolute; bottom:19px; left:50%; transform:translateX(-50%); display:flex; align-items:center; justify-content:center; gap:clamp(7px,2vw,13px); width:calc(100% - 36px); }
    .swatch { width:44px; height:44px; padding:0; border-radius:50%; border:1px solid color-mix(in srgb, var(--ink) 45%, transparent); background:var(--dot); cursor:pointer; position:relative; box-shadow:0 0 12px color-mix(in srgb, var(--dot) 45%, transparent); transition:transform .2s,box-shadow .4s; }
    .swatch:hover,.swatch:focus-visible { transform:scale(1.12); outline:none; }
    .swatch[aria-pressed="true"] { box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--dot),0 0 18px 5px var(--dot); }
    .love { min-height:102svh; padding:20vh 20px 20px; display:flex; flex-direction:column; align-items:center; text-align:center; }
    .love .small { font-size:clamp(11px,1.8vw,14px); letter-spacing:.16em; opacity:.48; margin-bottom:24px; }
    h1 { margin:0; min-height:1.2em; font-size:clamp(44px,11vw,116px); font-weight:400; letter-spacing:-.09em; color:var(--art); text-shadow:0 0 3px var(--art),0 0 15px var(--core),0 0 48px var(--halo); }
    .love-content { opacity:0; transform:translateY(16px); transition:opacity 1.4s ease,transform 1.4s ease; }
    .love-content.visible { opacity:1; transform:translateY(0); }
    .footer { margin-top:28px; opacity:.48; font-size:11px; letter-spacing:.08em; }
    body.revealed .prompt { opacity:0; }
    @keyframes grow { to { opacity:1; transform:translateY(0); filter:brightness(1); } }
    @keyframes flash { 0%,35% { opacity:.25; } 55% { opacity:1; } }
    @keyframes blink { 50% { opacity:0; } }
    @keyframes labelIn { to { opacity:.58; } }
    @keyframes hintIn { to { opacity:.62; } }
    @keyframes sweep { from { transform:translateY(-25vh); } to { transform:translateY(125vh); } }
    @media (max-width:470px) { .hero { padding-left:8px; padding-right:8px; } pre { font-size:clamp(6.1px,2.16vw,10px); } .flowers { min-height:340px; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; animation-iteration-count:1!important; scroll-behavior:auto!important; } .line { opacity:1; transform:none; filter:none; } .terminal-label,.prompt { opacity:.6; } .sweep { display:none; } }
  </style>
</head>
<body>
  <div class="crt"></div><div class="sweep"></div><div class="vignette"></div>
  <main>
    <section class="hero" aria-label="A bouquet of tulips">
      <p class="terminal-label">// a small thing I grew for you</p>
      <div class="flowers"><pre id="bouquet" aria-label="An ASCII art bouquet of tulips"></pre></div>
      <p class="prompt">&gt; scroll <span class="cursor" aria-hidden="true"></span></p>
      <div class="swatches" role="group" aria-label="Choose a phosphor color">
        <button class="swatch" style="--dot:#6dff9a" data-theme="green" aria-label="Phosphor green" aria-pressed="true"></button>
        <button class="swatch" style="--dot:#62eaff" data-theme="cyan" aria-label="Ice cyan" aria-pressed="false"></button>
        <button class="swatch" style="--dot:#ff62bf" data-theme="pink" aria-label="Neon pink" aria-pressed="false"></button>
        <button class="swatch" style="--dot:#ffba5d" data-theme="amber" aria-label="Warm amber" aria-pressed="false"></button>
        <button class="swatch" style="--dot:#bd82ff" data-theme="violet" aria-label="Violet" aria-pressed="false"></button>
        <button class="swatch" style="--dot:#e8f2ff" data-theme="ghost" aria-label="Ghost white" aria-pressed="false"></button>
      </div>
    </section>
    <section class="love" aria-label="Love letter">
      <div class="love-content" id="loveContent"><p class="small">&gt; message received_</p><h1 id="message" aria-label="I love you"></h1><p class="footer">always, in every color.</p></div>
    </section>
  </main>
  <script>
    const art = String.raw`                 *                         ,
                  .-^-._                 _.-^-.
              .-'  .-.  '-.           .-'  .-.  '-.
             /   .'   '.   \\         /   .'   '.   \\
            |   /  .-.  \\   |       |   /  .-.  \\   |
            |   \\ (   ) /   |       |   \\ (   ) /   |
             \\   '._.'    /         \\   '._.'    /
              '-._______.-'           '-._______.-'
                    |                       |
                 _ / \\ _                 _/ \\_
              .-'  /   \\  '-.        .-'  /   \\  '-.
             /    /     \\    \\      /    /     \\    \\
            /____/       \\____\\    /____/       \\____\\
                 \\       /                 \\       /
                  \\     /                   \\     /
                   \\   /                     \\   /
                    \\ /                       \\ /
          *          | |                       | |          *
                     | |       .-^-._          | |
                     | |    .-'  .-.  '-.      | |
                  _ / \\ _ /   .'   '.   \\  _ / \\ _
               .-'  /   \\|   /  .-.  \\   |-'  /   \\  '-.
              /    /     \\   \\ (   ) /   /    /     \\    \\
             /____/       \\   '._.'    /____/       \\____\\
                  \\       \\_________./       /       /
                   \\                          /       /
                    \\                        /       /
                     \\                      /       /
                      \\                    /       /
                       \\                  /       /
                        \\                /       /
                         \\              /       /
                          \\            /       /
                           \\          /       /
                            \\        /       /
                             '--------'       ,`;
    const bouquet = document.querySelector('#bouquet');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    art.split('\n').reverse().forEach((line, i) => { const s=document.createElement('span'); s.className='line'; s.textContent=line || ' '; bouquet.prepend(s); if(!reduce) setTimeout(()=>s.classList.add('on'), 850+i*118); });
    const themes = {
      green:['#b9ffd0','#e5ffed','#6dff9a','rgba(75,255,143,.45)','#020604','rgba(112,255,158,.13)'],
      cyan:['#b9f7ff','#e8fcff','#62eaff','rgba(68,215,255,.45)','#020608','rgba(96,230,255,.13)'],
      pink:['#ffd0ed','#fff0fa','#ff62bf','rgba(255,54,177,.44)','#090205','rgba(255,98,191,.13)'],
      amber:['#ffddb0','#fff3df','#ffba5d','rgba(255,151,43,.44)','#090602','rgba(255,186,93,.13)'],
      violet:['#e4ceff','#f5edff','#bd82ff','rgba(155,92,255,.46)','#07020b','rgba(189,130,255,.13)'],
      ghost:['#dfeaff','#ffffff','#b4d2ff','rgba(130,170,255,.38)','#030406','rgba(180,210,255,.12)']
    };
    document.querySelectorAll('.swatch').forEach(button => button.addEventListener('click', () => { const [ink,artc,core,halo,bg,scan]=themes[button.dataset.theme]; const r=document.documentElement.style; [['--ink',ink],['--art',artc],['--core',core],['--halo',halo],['--bg',bg],['--scan',scan]].forEach(([k,v])=>r.setProperty(k,v)); document.querySelectorAll('.swatch').forEach(b=>b.setAttribute('aria-pressed',b===button)); document.querySelector('meta[name="theme-color"]').content=bg; }));
    const content=document.querySelector('#loveContent'), message=document.querySelector('#message');
    new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting&&!content.classList.contains('visible')) { content.classList.add('visible'); document.body.classList.add('revealed'); let text='I love you.'; [...text].forEach((c,i)=>setTimeout(()=>message.textContent+=c,450+i*115)); }}),{threshold:.42}).observe(content);
  </script>
</body>
</html>
